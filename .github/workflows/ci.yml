name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conecta_amauc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conecta_amauc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ci_jwt_secret_apenas_para_testes
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conecta_amauc
      GOOGLE_CLIENT_ID: ci-google-client
      APPLE_CLIENT_ID: ci-apple-client

    defaults:
      run:
        working-directory: ca_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ca_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          find src scripts -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Migrate database
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Start API
        run: |
          npm run start > server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000/api/status && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run E2E
        run: npm run test:e2e

  flutter:
    name: Flutter Analyze/Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ca_frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
