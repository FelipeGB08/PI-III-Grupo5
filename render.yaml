services:
  - type: web
    name: conecta-amauc-api
    runtime: node
    plan: free
    region: oregon
    rootDir: ca_backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    initialDeployHook: npm run db:seed
    healthCheckPath: /api/v1/status
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: conecta-amauc-db
          property: connectionString
      - key: JWT_SECRET
        # O Render gera um valor aleatório forte; o boot recusa placeholders e segredos fracos.
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        # Obrigatória em produção: URLs http(s) separadas por vírgula, sem "*".
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Web Client ID usado como audience dos ID tokens Google.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Configuracoes publicas de login Apple; os valores reais ficam no Render.
      - key: APPLE_IOS_CLIENT_ID
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: APPLE_ANDROID_REDIRECT_URI
        sync: false
      - key: APPLE_WEB_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: GITHUB_WEB_REDIRECT_URI
        sync: false

databases:
  - name: conecta-amauc-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: conecta_amauc
    user: conecta_amauc
