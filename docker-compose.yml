services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conecta_amauc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conecta_amauc"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./ca_backend
      dockerfile: Dockerfile
    env_file:
      - path: ./ca_backend/.env
        required: false
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conecta_amauc
      DATABASE_URL: ""
    command: ["npm", "run", "db:init"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./ca_backend
      dockerfile: Dockerfile
    env_file:
      - path: ./ca_backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conecta_amauc
      DATABASE_URL: ""
    command:
      - sh
      - -c
      - export JWT_SECRET="$${JWT_SECRET:-docker-local-secret-change-me}"; exec npm start
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
