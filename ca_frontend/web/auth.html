<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Login GitHub concluído</title>
</head>
<body>
  <p>Login concluído. Esta janela será fechada automaticamente.</p>
  <script>
    (function () {
      const message = { 'flutter-web-auth-2': window.location.href };
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
        window.close();
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      } else {
        window.localStorage.setItem('flutter-web-auth-2', window.location.href);
        window.close();
      }
    }());
  </script>
</body>
</html>
