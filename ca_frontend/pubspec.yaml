name: ca_frontend
description: "Conecta AMAUC - Plataforma de Serviços Autônomos para a Região da AMAUC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
