name: ca_frontend
description: "Conecta AMAUC - Plataforma de Serviços Autônomos para a Região da AMAUC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_dotenv: ^6.0.1
  socket_io_client: ^3.1.6
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/app.env
